[package]
name = "modeler"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "MCP-driven mesh modeling tool: primitives, CSG booleans, UVs, op graph, glTF export. No game code"

[workspace]
members = [".", "crates/modeler_anim", "crates/modeler_bevy"]

[dependencies]
modeler_anim = { path = "crates/modeler_anim" }
# Bevy's defaults minus audio and gamepads (nothing here plays sound or
# reads a pad), so a Linux build needs no ALSA or udev.
bevy = { version = "=0.20.0", default-features = false, features = [
    # default_platform without bevy_gilrs
    "std", "bevy_winit", "bevy_clipboard", "default_font", "multi_threaded",
    "x11", "wayland", "custom_cursor", "sysinfo_plugin",
    # 2d + 3d + ui without audio
    "default_app", "scene", "picking", "2d_bevy_render", "3d_bevy_render",
    "ui_api", "ui_bevy_render", "bevy_ui_widgets", "bevy_feathers",
] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_path_to_error = "0.1"
manifold-csg = { version = "0.4", default-features = false }
rmcp = { version = "1", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
png = "0.18"
base64 = "0.22"
thiserror = "2"
schemars = "1"
rayon = "1"
libc = "0.2"
texture-compressor = { version = "0.2", features = ["parallel"] }
ruzstd = "0.8.3"
ttf-parser = "0.25"

[dev-dependencies]
gltf = "1"
ktx2 = "0.5"

[lints.clippy]
unwrap_used = "deny"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev]
opt-level = 1
# Line tables keep file:line in panics and samples, without the full debug
# info that made target/ tens of GB.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
# Dependencies (Bevy, wgpu, Manifold) are built optimised and never stepped
# through: no debug info at all.
debug = false
