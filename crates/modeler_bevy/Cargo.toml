[package]
name = "modeler_bevy"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Bevy plugin for modeler exports: live wind and spring sway, colliders and markers from glTF extras"

[dependencies]
bevy = { version = "=0.20.0", default-features = false, features = ["bevy_gltf"] }
modeler_anim = { path = "../modeler_anim" }
serde_json = "1"

[dev-dependencies]
bevy = { version = "=0.20.0" }

[lints.clippy]
unwrap_used = "deny"
