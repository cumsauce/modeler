<title>Modeler Workbench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: top bar (Grid of all documents | one document + its mode). In a document: left = what's in it,
   centre = the mode's main surface (3D, or the node graph in Material), right = properties / comments tabs. */
:root {
  color-scheme: dark;
  --bg: #15171c; --panel: #1c1f26; --raise: #252932; --line: #2e333e;
  --fg: #e3e6ec; --dim: #8a91a0; --faint: #5b6270;
  --accent: #6fa8ff; --accent-soft: rgba(111,168,255,.14);
  --ok: #5fc48a; --warn: #e2b24f; --bad: #ec6d6d;
  --a1: #c792ea; --a2: #f6a04d; --a3: #4fd1c5;
  --sans: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 13px/1.4 var(--sans); overflow: hidden;
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.mono { font-family: var(--mono); font-size: 12px; }
.app { display: grid; height: 100%; grid-template-rows: 48px 1fr; position: relative; }

/* top bar */
.top { display: flex; align-items: center; gap: 10px; padding: 0 10px; border-bottom: 1px solid var(--line); background: var(--panel); min-width: 0; }
.where { display: flex; align-items: stretch; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 2px; min-width: 0; }
.where > button { display: flex; align-items: center; gap: 8px; padding: 5px 10px; border-radius: 6px; color: var(--dim); white-space: nowrap; min-width: 0; }
.where > button[aria-pressed="true"] { background: var(--raise); color: var(--fg); }
.where .count { font: 11px var(--mono); background: var(--raise); border-radius: 99px; padding: 0 6px; color: var(--dim); }
.where > button[aria-pressed="true"] .count { background: var(--bg); }
.docname { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.docproj { color: var(--faint); overflow: hidden; text-overflow: ellipsis; }
.modes { display: flex; gap: 2px; margin-left: 4px; }
.modes button { padding: 6px 12px; border-radius: 6px; color: var(--dim); display: flex; gap: 6px; align-items: center; }
.modes button:hover:not(:disabled) { color: var(--fg); }
.modes button[aria-pressed="true"] { color: var(--fg); background: var(--raise); }
.modes button:disabled { opacity: .3; cursor: default; }
.modes[hidden] { display: none !important; }
.spacer { flex: 1; }
.agents { display: flex; align-items: center; gap: 4px; }
.agent { display: flex; align-items: center; gap: 6px; padding: 3px 8px 3px 6px; border-radius: 99px; background: var(--raise); font-size: 12px; color: var(--dim); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.dot.live { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.iconbtn { padding: 5px 9px; border-radius: 6px; color: var(--dim); border: 1px solid var(--line); }
.iconbtn:hover { color: var(--fg); background: var(--raise); }

/* document switcher */
.docpop { position: absolute; top: 44px; left: 10px; width: 380px; max-width: calc(100vw - 20px); max-height: min(520px, 70vh); display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 18px 50px rgba(0,0,0,.5); z-index: 30; }
.docpop[hidden] { display: none !important; }
.docpop input { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; margin: 8px; padding: 7px 9px; color: var(--fg); font: inherit; }
.docpop .list { overflow: auto; padding: 0 6px 8px; }
.docpop .grp { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); padding: 8px 8px 4px; display: flex; justify-content: space-between; }
.docrow { display: grid; grid-template-columns: 16px 1fr auto; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
.docrow:hover, .docrow.on { background: var(--raise); }
.docrow .sub { color: var(--faint); font-size: 11px; }
.docrow .r { color: var(--faint); font-size: 11px; text-align: right; white-space: nowrap; }

/* workspace */
.work { display: grid; grid-template-columns: 250px 1fr 290px; grid-template-rows: 1fr auto; min-height: 0; }
.left, .right { background: var(--panel); min-height: 0; overflow: auto; }
.left { border-right: 1px solid var(--line); grid-row: 1 / 3; }
.right { border-left: 1px solid var(--line); grid-row: 1 / 3; grid-column: 3; display: flex; flex-direction: column; }
.paneh { position: sticky; top: 0; background: var(--panel); z-index: 1; display: flex; align-items: center; justify-content: space-between; padding: 10px 12px 6px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
.tree { padding: 0 6px 12px; }
.row { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 5px; cursor: pointer; white-space: nowrap; min-width: 0; color: var(--fg); }
.row:hover { background: var(--raise); }
.row.sel { background: var(--accent-soft); }
.row .name { overflow: hidden; text-overflow: ellipsis; flex: 1; }
.row .meta { color: var(--faint); font-size: 11px; }
.row svg.i { color: var(--dim); }
.row .eye { color: var(--dim); display: grid; place-items: center; }
.row .eye.off { color: var(--faint); opacity: .5; }
.row.off .name { color: var(--faint); }
.row.child { padding-left: 28px; }
.swatch { width: 14px; height: 14px; border-radius: 4px; flex: none; }
.badge { font: 10px var(--mono); padding: 0 5px; border-radius: 4px; background: var(--raise); color: var(--dim); }

/* viewport */
.view { position: relative; min-height: 0; background: radial-gradient(ellipse at 50% 35%, #232731 0%, #16181d 70%); overflow: hidden; }
.view canvas#gl { display: block; width: 100%; height: 100%; }
.hud { position: absolute; display: flex; gap: 6px; align-items: center; }
.hud.tl { top: 10px; left: 10px; } .hud.tr { top: 10px; right: 10px; } .hud.br { bottom: 10px; right: 10px; }
.chip { background: rgba(21,23,28,.82); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; color: var(--dim); font-size: 12px; backdrop-filter: blur(6px); display: inline-flex; align-items: center; gap: 6px; }
.chip.small { font-size: 11px; padding: 2px 7px; border-radius: 99px; }
.chip b { color: var(--fg); font-weight: 500; }
.seg { display: flex; background: rgba(21,23,28,.82); border: 1px solid var(--line); border-radius: 6px; padding: 2px; }
.seg button { padding: 3px 9px; border-radius: 4px; color: var(--dim); font-size: 12px; }
.seg button[aria-pressed="true"] { background: var(--raise); color: var(--fg); }
.menu { position: relative; }
.menu .pop { position: absolute; right: 0; top: calc(100% + 4px); width: 250px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px; box-shadow: 0 12px 30px rgba(0,0,0,.45); z-index: 6; }
.menu .pop[hidden] { display: none !important; }
.menu .opt { display: grid; grid-template-columns: 16px 1fr; gap: 2px 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; width: 100%; text-align: left; }
.menu .opt:hover { background: var(--raise); }
.menu .opt .d { grid-column: 2; color: var(--faint); font-size: 11.5px; }
.pin { position: absolute; transform: translate(-50%, -100%); }
.pin span { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 11px 11px 11px 2px; background: var(--warn); color: #1b1600; font: 600 11px var(--sans); transform: rotate(-45deg); }
.pin span i { transform: rotate(45deg); font-style: normal; }
.toast { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 4; }
.minimap { width: 150px; height: 150px; border-radius: 8px; border: 1px solid var(--line); background: rgba(21,23,28,.85); overflow: hidden; cursor: pointer; }
.minimap canvas { width: 100%; height: 100%; display: block; }

/* material: graph is the main surface */
.graphhost { position: absolute; inset: 0; overflow: auto; background-color: #181a20; background-image: radial-gradient(#2a2f3a 1px, transparent 1px); background-size: 18px 18px; }
.graphhost[hidden] { display: none !important; }
.graph { position: relative; width: 820px; height: 420px; margin: 24px; }
.graph svg.wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.gnode { position: absolute; width: 150px; display: grid; grid-template-columns: 28px 1fr; gap: 0 8px; align-items: center; padding: 5px; background: var(--raise); border: 1px solid var(--line); border-radius: 7px; cursor: pointer; }
.gnode.sel { border-color: var(--accent); }
.gnode canvas { width: 28px; height: 28px; border-radius: 4px; grid-row: 1 / 3; }
.gnode .n { font-size: 12px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gnode .t { font: 10.5px var(--mono); color: var(--faint); line-height: 1.2; }
.prev { padding: 12px; border-bottom: 1px solid var(--line); }
.prev .ball { width: 100%; aspect-ratio: 1; max-width: 100%; display: block; border-radius: 8px; background: #181a20; }
.prev .chans { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
.prev .chans canvas { width: 100%; aspect-ratio: 1; border-radius: 4px; display: block; }
.prev .chans span { font-size: 10.5px; color: var(--faint); display: block; text-align: center; margin-top: 2px; }

/* animate dock */
.dock { grid-column: 2; border-top: 1px solid var(--line); background: var(--panel); min-width: 0; }
.dock[hidden] { display: none !important; }
.dockh { display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--dim); }
.dockb { height: 186px; overflow: auto; position: relative; }
.tl { display: grid; grid-template-columns: 130px 1fr; font-size: 12px; min-width: 640px; position: relative; }
.tl .lbl { padding: 4px 12px; color: var(--dim); border-bottom: 1px solid var(--line); height: 26px; white-space: nowrap; }
.tl .lane { position: relative; border-bottom: 1px solid var(--line); height: 26px; }
.key { position: absolute; top: 8px; width: 9px; height: 9px; background: var(--fg); transform: rotate(45deg); margin-left: -4px; }
.key.mir { background: none; border: 1.5px solid var(--dim); }
.ruler { position: relative; height: 22px; border-bottom: 1px solid var(--line); cursor: ew-resize; }
.ruler span { position: absolute; top: 4px; font: 10px var(--mono); color: var(--faint); transform: translateX(-50%); }
.playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); pointer-events: none; }
.playbtn { padding: 2px 10px; border-radius: 5px; background: var(--raise); color: var(--fg); }

/* right pane tabs */
.tabs { display: flex; gap: 2px; padding: 8px 8px 0; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 2; }
.tabs button { padding: 6px 10px; color: var(--dim); border-bottom: 2px solid transparent; display: flex; gap: 6px; align-items: center; }
.tabs button[aria-selected="true"] { color: var(--fg); border-color: var(--accent); }
.sect { padding: 6px 12px 14px; }
.kv { display: grid; grid-template-columns: 90px 1fr; gap: 5px 8px; font-size: 12px; margin: 0; }
.kv dt { color: var(--dim); } .kv dd { margin: 0; font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.cmt { display: grid; grid-template-columns: 22px 1fr; gap: 0 10px; padding: 10px 4px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 12.5px; }
.cmt:hover { background: rgba(255,255,255,.02); }
.cmt .num { width: 20px; height: 20px; border-radius: 50%; background: var(--warn); color: #1b1600; font: 600 11px var(--sans); display: grid; place-items: center; }
.cmt .hd { display: flex; gap: 6px; align-items: baseline; margin-bottom: 2px; }
.cmt .hd b { font-weight: 500; } .cmt .hd span { color: var(--faint); font-size: 11px; }
.cmt .reply { margin-top: 8px; padding-left: 10px; border-left: 2px solid var(--line); color: var(--dim); }
.cmt .reply .hd b { color: var(--fg); }
.work.noright { grid-template-columns: 250px 1fr; }
.work.noright .right { display: none; }
.where kbd, .modes kbd { font: 10px var(--mono); color: var(--faint); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
.ovbar { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; position: sticky; top: -14px; background: var(--bg); padding: 4px 0 8px; z-index: 2; }
.ovbar input { flex: 1; max-width: 320px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; color: var(--fg); font: inherit; }
.ovbar button { padding: 5px 10px; border-radius: 6px; color: var(--dim); border: 1px solid var(--line); }
.ovbar button[aria-pressed="true"] { color: var(--fg); background: var(--raise); }
.ovsec { grid-column: 1 / -1; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); padding-top: 6px; }
.compose { display: flex; gap: 6px; margin-top: 8px; }
.compose input { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; color: var(--fg); font: inherit; }
.primary { background: var(--accent); color: #08162b; padding: 6px 10px; border-radius: 6px; font-weight: 600; }
.primary:disabled { opacity: .4; }
.hint { color: var(--faint); font-size: 12px; }

/* grid of all documents */
.overview { position: absolute; top: 48px; left: 0; right: 0; bottom: 0; background: var(--bg); display: grid; grid-template-columns: 1fr 280px; z-index: 5; }
.overview[hidden] { display: none !important; }
.ovgrid { padding: 14px; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; align-content: start; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; }
.tile:hover { border-color: var(--faint); }
.tile .thumb { aspect-ratio: 16/10; max-width: 100%; position: relative; background: radial-gradient(ellipse at 50% 40%, #262b35, #17191e); }
.tile .thumb canvas { width: 100%; height: 100%; display: block; }
.tile .info { padding: 8px 10px; display: flex; gap: 8px; align-items: center; }
.tile .info .n { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .x { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 6px; background: rgba(21,23,28,.85); color: var(--dim); display: grid; place-items: center; opacity: 0; }
.tile:hover .x, .tile .x:focus-visible { opacity: 1; }
.tile .x:hover { color: var(--fg); }
.tile .confirm { position: absolute; inset: auto 6px 6px 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 8px; font-size: 12px; display: flex; gap: 6px; align-items: center; }
.tile .working { position: absolute; left: 8px; top: 8px; }
.ovside { border-left: 1px solid var(--line); background: var(--panel); overflow: auto; }
.feed { font-size: 12px; }
.feed .ev { display: grid; grid-template-columns: 8px 1fr auto; gap: 8px; align-items: baseline; padding: 5px 0; cursor: pointer; }
.feed .ev time { color: var(--faint); font-family: var(--mono); font-size: 11px; }
.feed .ev .what { color: var(--dim); } .feed .ev .what b { color: var(--fg); font-weight: 500; }

/* concept notes */
.notes { position: fixed; left: 12px; bottom: 12px; width: 300px; z-index: 15; background: #fff7dd; color: #2b2410; border-radius: 10px; padding: 10px 12px 12px; box-shadow: 0 10px 30px rgba(0,0,0,.45); font-size: 12.5px; }
.notes h3 { margin: 0 0 4px; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; display: flex; justify-content: space-between; }
.notes h3 button { color: #6b5a22; }
.notes ul { margin: 0; padding-left: 16px; }
.notes li { margin: 3px 0; }
.notes.min ul { display: none; }

@media (max-width: 900px) {
  .work { grid-template-columns: 1fr; grid-template-rows: 46vh auto auto auto; overflow: auto; }
  .left, .right, .dock { grid-column: 1; grid-row: auto; border: 0; border-top: 1px solid var(--line); }
  .view { grid-row: 1; }
  .docproj, .agents .agent span, .where .lbl { display: none; }
  body { overflow: auto; }
  .overview { grid-template-columns: 1fr; overflow: auto; }
  .notes { width: calc(100vw - 24px); }
}
@media (prefers-reduced-motion: reduce) { .dot.live { animation: none; } }
</style>

<div class="app">
  <header class="top">
    <div class="where" role="group" aria-label="View">
      <button id="gridbtn" aria-pressed="false" title="Every open document side by side, newest first"><svg class="i"><use href="#i-grid"/></svg><span class="lbl">All documents</span><span class="count" id="doccount">6</span></button>
      <button id="docbtn" aria-pressed="true" title="Switch document"><span class="docproj" id="cproj">friendSLOP/crates/game /</span><span class="docname" id="cdoc">commune-map</span><svg class="i"><use href="#i-chev"/></svg></button>
    </div>
    <nav class="modes" id="modes" aria-label="Mode">
      <button data-mode="model">Model <kbd>1</kbd></button>
      <button data-mode="material">Material <kbd>2</kbd></button>
      <button data-mode="animate">Animate <kbd>3</kbd></button>
      <button data-mode="map">Map <kbd>4</kbd></button>
    </nav>
    <div class="spacer"></div>
    <div class="agents" id="agents"></div>
  </header>
  <div class="docpop" id="docpop" hidden><input id="docq" placeholder="Find a document" autocomplete="off"><div class="list" id="doclist"></div></div>

  <div class="work" id="work">
    <aside class="left" id="left"></aside>
    <main class="view" id="view">
      <canvas id="gl"></canvas>
      <div class="graphhost" id="graphhost" hidden></div>
      <div id="pins"></div>
      <div class="hud tl" id="hudtl"></div>
      <div class="hud tr" id="hudtr"></div>
      <div class="hud br" id="hudbr"></div>
      <div class="toast" id="toast" hidden></div>
    </main>
    <section class="dock" id="dock"><div class="dockh" id="dockh"></div><div class="dockb" id="dockb"></div></section>

  </div>

  <div class="overview" id="overview" hidden>
    <div class="ovgrid" id="ovgrid"></div>
    <aside class="ovside">
      <div class="paneh">What agents are doing</div>
      <div class="sect feed" id="feedAll"></div>
    </aside>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

function noise(x, z) { return Math.sin(x * 0.07) * Math.cos(z * 0.06) * 1.6 + Math.sin(x * 0.021 + z * 0.03) * 1.2 + Math.sin(z * 0.15 + x * 0.05) * 0.3; }

// Terrain: a flat tint with contour lines from world height (0.5 m minor, 2.5 m major).
function contourMaterial() {
  const m = new THREE.MeshStandardMaterial({ color: 0x5d7a55, roughness: 1 });
  m.onBeforeCompile = sh => {
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying float vH;').replace('#include <begin_vertex>', '#include <begin_vertex>\nvH = (modelMatrix * vec4(position,1.0)).y;');
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying float vH;\nfloat iso(float h, float step, float w){ float f = abs(fract(h/step + 0.5) - 0.5) * step; float aa = fwidth(h) * w; return 1.0 - smoothstep(0.0, aa, f); }')
      .replace('#include <color_fragment>', '#include <color_fragment>\nfloat minor = iso(vH, 0.5, 1.0); float major = iso(vH, 2.5, 1.8);\nvec3 tint = mix(vec3(0.24,0.33,0.22), vec3(0.42,0.5,0.36), clamp(vH/4.0 + 0.4, 0.0, 1.0));\ndiffuseColor.rgb = mix(tint, vec3(0.86,0.92,0.78), max(minor*0.35, major*0.75));');
  };
  m.extensions = { derivatives: true };
  return m;
}

function tag(g, name, layer) { g.name = name; g.userData.layer = layer; g.traverse(m => { if (m.isMesh) { m.name = name; pickables.push(m); } }); world.add(g); }
function buildMap() {
  const N = 140, size = 220;
  const geo = new THREE.PlaneGeometry(size, size, N, N); geo.rotateX(-Math.PI / 2);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, groundY(p.getX(i), p.getZ(i)));
  geo.computeVertexNormals();
  const ground = new THREE.Mesh(geo, contourMaterial()); ground.receiveShadow = true;
  const gg = new THREE.Group(); gg.add(ground); tag(gg, 'ground', 'terrain');
  const place = (list, layer) => list.forEach(o => { const g = new THREE.Group(); o.build(g); g.position.set(o.at[0], groundY(o.at[0], o.at[1]), o.at[1]); g.traverse(m => { if (m.isMesh) m.castShadow = true; }); tag(g, o.name, layer); });
  place(MAPDEF.prefabs, 'prefabs'); place(MAPDEF.previews, 'previews');
  MAPDEF.plots.forEach(([x, z, w, d], i) => {
    const g = new THREE.Group();
    const pad = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshBasicMaterial({ color: 0xf6a04d, transparent: true, opacity: 0.22, depthWrite: false }));
    pad.rotation.x = -Math.PI / 2; pad.position.y = 0.08; g.add(pad);
    const e = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(w, d)), new THREE.LineBasicMaterial({ color: 0xf6a04d }));
    e.rotation.x = -Math.PI / 2; e.position.y = 0.09; g.add(e);
    g.position.set(x, groundY(x, z), z); tag(g, 'plot_' + (i + 1), 'zones');
  });
  MAPDEF.zones.forEach(([name, x, z, w, d, c]) => {
    const g = new THREE.Group();
    const e = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(w, d)), new THREE.LineDashedMaterial({ color: c, dashSize: 2, gapSize: 1.4, transparent: true, opacity: 0.7 }));
    e.rotation.x = -Math.PI / 2; e.computeLineDistances(); g.add(e); g.position.set(x, 3.2, z); g.name = name; g.userData.layer = 'zones'; world.add(g);
  });

    g.add(stem, head); g.position.set(x, groundY(x, z), z); tag(g, name, 'spots');
  });
}

  else { buildMug(); Object.assign(orbit, { target: new THREE.Vector3(0, 0.05, 0), dist: 0.38, yaw: 0.8, pitch: 0.45 }); scene.fog = null; }
  applyLayers(); applyShading();
}
function applyLayers() { world.children.forEach(o => { const l = o.userData.layer; if (l) o.visible = !!S.layers[l]; }); }
const PART_COLORS = [0x6fa8ff, 0xf6a04d, 0x5fc48a, 0xc792ea, 0xe2b24f, 0x4fd1c5, 0xec6d6d];
function applyShading() {
  setTimeout(applySelection);
  const names = [...new Set(pickables.map(m => m.name))];
  pickables.forEach(m => {
    if (m.userData.orig === undefined) m.userData.orig = m.material;
    if (S.shading === 'parts') m.material = new THREE.MeshBasicMaterial({ color: PART_COLORS[names.indexOf(m.name) % PART_COLORS.length], side: m.userData.orig.side });
    else if (S.shading === 'clay') m.material = new THREE.MeshStandardMaterial({ color: 0xc9c3b8, roughness: 0.8, side: m.userData.orig.side });
    else m.material = m.userData.orig;
  });
}

function applySelection() {
  pickables.forEach(m => { if (!m.material.emissive) return; const on = m.name === S.sel, hv = m.name === S.hover && m.name !== 'ground';
    m.material.emissive.setHex(on ? 0x24477a : hv ? 0x152a48 : 0); });
}

const keys = new Set(); let drag = null;

canvas.addEventListener('pointermove', e => {
  if (!drag) { const h = hitAt(e); const n = h ? h.object.name : null; if (n !== S.hover) { S.hover = n; canvas.style.cursor = n && n !== 'ground' ? 'pointer' : ''; applySelection(); } return; } const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY; drag.moved += Math.abs(dx) + Math.abs(dy);
  const flying = S.mode === 'map' && S.cam === 'fly';
  if (flying && (drag.b === 0 || drag.b === 2)) { fly.yaw += dx * 0.004; fly.pitch = Math.max(-1.5, Math.min(1.5, fly.pitch - dy * 0.004)); }
  else if (drag.b === 0) { orbit.yaw += dx * 0.01; orbit.pitch = Math.max(-1.45, Math.min(1.45, orbit.pitch + dy * 0.01)); }
  else panBy(dx, dy);
});
canvas.addEventListener('pointerup', e => { if (drag && drag.moved < 4 && drag.b === 0) pick(e); drag = null; });
canvas.addEventListener('wheel', e => { e.preventDefault(); if (S.mode === 'map' && S.cam === 'fly') fly.pos.addScaledVector(flyDir(), -e.deltaY * 0.05); else orbit.dist = Math.max(0.05, orbit.dist * Math.exp(e.deltaY * 0.0012)); }, { passive: false });
function panBy(dx, dy) { const s = orbit.dist * 0.0015; const r = new THREE.Vector3(Math.sin(orbit.yaw), 0, -Math.cos(orbit.yaw)); orbit.target.addScaledVector(r, -dx * s); orbit.target.y += dy * s; }
const flyDir = () => new THREE.Vector3(Math.sin(fly.yaw) * Math.cos(fly.pitch), Math.sin(fly.pitch), -Math.cos(fly.yaw) * Math.cos(fly.pitch));
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') { if (e.key === 'Escape') closePops(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openDocs(); return; }
  if (e.key === 'Escape') { closePops(); if (S.sel) { S.sel = null; S.pin = null; applySelection(); renderLeft(); renderRight(); } }
  keys.add(e.code);
  const flying = S.mode === 'map' && S.cam === 'fly';
  if (flying && ['KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyQ', 'KeyE'].includes(e.code)) return;
  const dm = { Digit1: 'model', Digit2: 'material', Digit3: 'animate', Digit4: 'map' }[e.code];
  if (dm && S.view === 'doc' && doc().modes.includes(dm)) { setMode(dm); return; }
  if (e.code === 'KeyC' && S.view === 'doc') { S.showComments = !S.showComments; S.pin = null; renderRight(); renderHud(); return; }
  if (e.code === 'Space' && S.mode === 'animate') { e.preventDefault(); S.playing = !S.playing; renderDock(); }
  if (e.code === 'KeyF' && S.mode === 'map') { S.cam = S.cam === 'fly' ? 'orbit' : 'fly'; renderHud(); }
});

  const lanes = [['root · move', [0, 0.25, 0.5, 0.75, 1]], ['spine · turn', [0, 0.5, 1]], ['head · turn', [0, 0.25, 0.5, 0.75]], ['wing_l · turn', [0, 0.3, 0.6]], ['wing_r · turn', [0.5, 0.8, 0.1], true], ['tail · spring', []]];

  B.innerHTML = `<div class="tl"><div class="lbl"></div><div class="ruler" id="ruler">${[0, .1, .2, .3, .4, .5, .6, .7, .8].map((t, i) => `<span style="left:${i / 8 * 100}%">${t.toFixed(1)}</span>`).join('')}</div>${lanes.map(([n, ks, mir]) => `<div class="lbl">${n}</div><div class="lane">${ks.map(k => `<i class="key ${mir ? 'mir' : ''}" style="left:${k * 100}%"></i>`).join('')}${n.includes('spring') ? '<span style="position:absolute;left:8px;top:5px;color:var(--faint);font-size:11px">simulated, follows hop</span>' : ''}</div>`).join('')}<div class="playhead" id="playhead" style="left:calc(130px + (100% - 130px) * ${S.t})"></div></div>`;
  $('#play').onclick = () => { S.playing = !S.playing; renderDock(); };
  const ruler = $('#ruler'); const scrub = e => { const r = ruler.getBoundingClientRect(); S.t = Math.max(0, Math.min(0.999, (e.clientX - r.left) / r.width)); S.playing = false; $('#playhead').style.left = `calc(130px + (100% - 130px) * ${S.t})`; };
  ruler.onpointerdown = e => { scrub(e); ruler.setPointerCapture(e.pointerId); ruler.onpointermove = scrub; }; ruler.onpointerup = () => ruler.onpointermove = null;
}

const SHADES = [['lit', 'Lit', 'Materials and lights as they will look'], ['clay', 'Clay', 'One neutral grey: judge the shape alone'], ['parts', 'By part', 'Each part a flat colour, to tell parts apart']];
function renderHud() {
  const d = doc(); const material = S.mode === 'material';
  $('#gl').style.visibility = material ? 'hidden' : 'visible'; $('#graphhost').hidden = !material; if (material) renderGraph();
  $('#hudtl').innerHTML = d.working && !material ? `<span class="chip small"><i class="dot live" style="background:${AGENTS[d.by].color}"></i>${d.by} editing</span>` : '';
  if (material) { $('#hudtr').innerHTML = ''; $('#hudbr').innerHTML = ''; return; }
  const cur = SHADES.find(s => s[0] === S.shading);
  const view = `<div class="menu"><button class="chip" id="viewbtn">${ic('view')}<b>${cur[1]}</b>${ic('chev')}</button><div class="pop" id="viewpop" hidden>${SHADES.map(([k, n, ds]) => `<button class="opt" data-shade="${k}"><span>${S.shading === k ? '✓' : ''}</span><span>${n}</span><span class="d">${ds}</span></button>`).join('')}${S.mode === 'animate' ? '' : ''}</div></div>`;
  const nc = (PINS[S.doc] || []).length;
  const cbtn = `<button class="chip" id="cbtn" title="Comments (C)" style="${S.showComments ? 'color:var(--fg);border-color:var(--warn)' : ''}">${ic('pin')}<b>${nc}</b></button>`;
  $('#hudtr').innerHTML = cbtn + (S.mode === 'map' ? `<div class="seg"><button data-cam="fly" aria-pressed="${S.cam === 'fly'}" title="Drag to look, WASD to move (F)">Fly</button><button data-cam="orbit" aria-pressed="${S.cam === 'orbit'}" title="Drag to turn around a point (F)">Orbit</button></div>` : '') + view;
  $('#hudbr').innerHTML = S.mode === 'map' ? `<div class="minimap" title="Click to jump there"><canvas id="mini"></canvas></div>` : '';
  $('#cbtn').onclick = () => { S.showComments = !S.showComments; S.pin = null; renderRight(); renderHud(); };
  $('#viewbtn').onclick = () => { $('#viewpop').hidden = !$('#viewpop').hidden; };
  $('#viewpop').onclick = e => { const o = e.target.closest('[data-shade]'); if (!o) return; S.shading = o.dataset.shade; applyShading(); renderHud(); };
  $('#hudtr').querySelectorAll('[data-cam]').forEach(b => b.onclick = () => { S.cam = b.dataset.cam; if (S.cam === 'orbit') { orbit.target.copy(camera.position).addScaledVector(flyDir(), 30); orbit.target.y = 2; orbit.dist = 34; } renderHud(); });
  const m = $('#mini'); if (m) m.onclick = e => { const r = m.getBoundingClientRect(); const x = (e.clientX - r.left) / r.width * 220 - 110, z = (e.clientY - r.top) / r.height * 220 - 110; fly.pos.set(x, groundY(x, z) + 14, z + 22); fly.pitch = -0.5; fly.yaw = 0; S.cam = 'fly'; renderHud(); };
}

function renderOverview() {
  $('#overview').hidden = S.view !== 'grid'; if (S.view !== 'grid') return;
  const q = S.ovq.toLowerCase();
  const ds = DOCS.filter(d => d.id.includes(q) && (S.ovfilter === 'all' || (S.ovfilter === 'working' ? d.working : !d.saved)));
  const tile = d => `<div class="tile" data-doc="${d.id}" tabindex="0"><div class="thumb"><canvas data-tthumb="${d.id}"></canvas>${d.working ? `<span class="chip small working"><i class="dot live" style="background:${AGENTS[d.by].color}"></i>${d.by} editing</span>` : ''}<button class="x" data-close="${d.id}" aria-label="Close ${d.id}">${ic('x')}</button></div><div class="info"><span class="n">${d.id}</span><span class="badge">${d.kind}</span></div><div class="info" style="padding-top:0;color:var(--faint);font-size:12px"><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${d.project}</span><span>${d.by} · ${d.ago}${d.saved ? '' : ' · <span style="color:var(--warn)">unsaved</span>'}</span></div></div>`;
  const bar = `<div class="ovbar"><input id="ovq" placeholder="Filter ${DOCS.length} documents" value="${S.ovq}">${[['all', 'All'], ['working', 'Agent working'], ['unsaved', 'Unsaved']].map(([k, n]) => `<button data-ovf="${k}" aria-pressed="${S.ovfilter === k}">${n}</button>`).join('')}</div>`;
  $('#ovgrid').innerHTML = bar + [...new Set(ds.map(d => d.project))].map(p => `<div class="ovsec">${p} · ${ds.filter(d => d.project === p).length}</div>` + ds.filter(d => d.project === p).map(tile).join('')).join('');
  const qi = $('#ovq'); qi.oninput = () => { S.ovq = qi.value; renderOverview(); const n = $('#ovq'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
  $('#feedAll').innerHTML = FEED.map(feedRow).join('');
  document.querySelectorAll('[data-tthumb]').forEach(c => thumb(c, c.dataset.tthumb));
}
function thumb(c, id) {
  const g = c.getContext('2d'); const W = c.width = 320, H = c.height = 200; g.fillStyle = '#1d2027'; g.fillRect(0, 0, W, H);
  if (id === 'commune-map') { g.fillStyle = '#4c6646'; g.beginPath(); g.moveTo(0, 110); g.lineTo(W, 80); g.lineTo(W, H); g.lineTo(0, H); g.fill(); g.strokeStyle = 'rgba(220,235,200,.35)'; for (let k = 0; k < 7; k++) { g.beginPath(); for (let x = 0; x <= W; x += 8) g.lineTo(x, 118 - x * 0.1 + k * 13 + Math.sin(x * 0.04 + k) * 5); g.stroke(); } g.fillStyle = '#4a3328'; g.fillRect(150, 70, 60, 34); g.fillStyle = '#e9e1cc'; g.fillRect(230, 90, 22, 14); g.strokeStyle = '#f6a04d'; [60, 90, 120].forEach(x => g.strokeRect(x, 150, 22, 14)); }
  else if (id === 'pine-tree') { g.fillStyle = '#664226'; g.fillRect(154, 150, 12, 26); g.fillStyle = '#2b8038'; [[160, 40, 40], [160, 75, 55], [160, 110, 70]].forEach(([x, y, w]) => { g.beginPath(); g.moveTo(x, y); g.lineTo(x - w, y + 50); g.lineTo(x + w, y + 50); g.fill(); }); }
  else if (id === 'zn-windmill') { g.fillStyle = '#ece4d4'; g.fillRect(140, 70, 40, 100); g.fillStyle = '#b85440'; g.beginPath(); g.moveTo(130, 72); g.lineTo(160, 40); g.lineTo(190, 72); g.fill(); g.strokeStyle = '#7a5a3a'; g.lineWidth = 5; g.beginPath(); g.moveTo(110, 40); g.lineTo(210, 120); g.moveTo(210, 40); g.lineTo(110, 120); g.stroke(); }
  else if (id === 'pt-crow') { g.fillStyle = '#2a2a33'; g.beginPath(); g.ellipse(160, 115, 45, 38, 0, 0, 7); g.fill(); g.beginPath(); g.arc(190, 78, 25, 0, 7); g.fill(); g.fillStyle = '#e0a43a'; g.beginPath(); g.moveTo(210, 74); g.lineTo(238, 80); g.lineTo(210, 86); g.fill(); }
  else if (id === 'fu-table') { g.fillStyle = '#9a6b42'; g.fillRect(90, 80, 140, 16); g.fillRect(100, 96, 10, 60); g.fillRect(210, 96, 10, 60); g.fillStyle = '#e88a2e'; g.beginPath(); g.arc(150, 72, 9, 0, 7); g.arc(170, 72, 9, 0, 7); g.fill(); }
  else { g.fillStyle = '#3a6fb5'; g.fillRect(130, 70, 60, 80); g.strokeStyle = '#3a6fb5'; g.lineWidth = 8; g.beginPath(); g.arc(196, 110, 18, -1.4, 1.4); g.stroke(); }
}

function toast(t) { const e = $('#toast'); e.innerHTML = `<span class="chip"><b>${t}</b></span>`; e.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => e.hidden = true, 2600); }
function renderNotes() { $('#notelist').innerHTML = NOTES[S.view === 'grid' ? 'grid' : S.mode].map(n => `<li>${n}</li>`).join(''); }
function renderAll() { renderTop(); renderOverview(); renderLeft(); renderRight(); renderDock(); renderHud(); renderNotes(); requestAnimationFrame(resize); }

// wiring
$('#gridbtn').onclick = () => { S.view = 'grid'; closePops(); renderAll(); };
$('#docbtn').onclick = () => { if (S.view === 'grid') { S.view = 'doc'; renderAll(); } else if ($('#docpop').hidden) openDocs(); else closePops(); };
$('#modes').onclick = e => { const b = e.target.closest('button'); if (b && !b.disabled) setMode(b.dataset.mode); };
$('#left').onclick = e => {
  const eye = e.target.closest('[data-layer]'); if (eye) { const k = eye.dataset.layer; S.layers[k] = !S.layers[k]; applyLayers(); renderLeft(); return; }
  const r = e.target.closest('[data-sel]'); if (!r || !r.dataset.sel) return; const v = r.dataset.sel;
  if (v.startsWith('clip:')) { S.clip = v.slice(5); renderLeft(); renderDock(); return; }
  if (v.startsWith('mat:') || v.startsWith('lib:')) { toast(`Showing ${v.slice(4)}'s graph`); return; }
  S.sel = v; S.pin = null;
  if (S.mode === 'map') { const o = [...MAPDEF.prefabs, ...MAPDEF.previews].find(p => p.name === v); const sp = MAPDEF.spots.find(s => s[0] === v); const at = o ? o.at : sp ? [sp[1], sp[2]] : null; if (at) { fly.pos.set(at[0] + 14, groundY(...at) + 12, at[1] + 18); const dir = new THREE.Vector3(at[0], groundY(...at) + 2, at[1]).sub(fly.pos).normalize(); fly.yaw = Math.atan2(dir.x, -dir.z); fly.pitch = Math.asin(dir.y); S.cam = 'fly'; renderHud(); } }
  renderLeft(); renderRight();
};
$('#right').onclick = e => {
  if (e.target.closest('[data-close]')) { S.sel = null; S.pin = null; applySelection(); renderLeft(); renderRight(); return; }
  if (e.target.closest('[data-closec]')) { S.showComments = false; S.pin = null; renderRight(); renderHud(); return; }
  if (e.target.closest('[data-allc]')) { S.sel = null; S.showComments = true; applySelection(); renderLeft(); renderRight(); renderHud(); return; }
  if (e.target.closest('[data-addc]')) { S.showComments = true; toast('Click the spot on the model'); renderHud(); return; }
  const c = e.target.closest('[data-pin]'); if (c) { const p = PINS[S.doc].find(p => p.n == c.dataset.pin); S.sel = p.part; if (S.mode === 'map') { fly.pos.set(p.at[0] + 12, p.at[1] + 10, p.at[2] + 16); const dir = new THREE.Vector3(...p.at).sub(fly.pos).normalize(); fly.yaw = Math.atan2(dir.x, -dir.z); fly.pitch = Math.asin(dir.y); } applySelection(); renderLeft(); renderRight(); } };
$('#graphhost').onclick = e => { const n = e.target.closest('[data-node]'); if (n) { S.matNode = n.dataset.node; renderGraph(); renderRight(); } };
$('#ovgrid').onclick = e => {
  const f = e.target.closest('[data-ovf]'); if (f) { S.ovfilter = f.dataset.ovf; renderOverview(); return; }
  const x = e.target.closest('[data-close]');
  if (x) { e.stopPropagation(); const d = DOCS.find(d => d.id === x.dataset.close); const tile = x.closest('.tile');
    if (d.saved) { DOCS.splice(DOCS.indexOf(d), 1); renderAll(); toast(`Closed ${d.id}`); }
    else if (!tile.querySelector('.confirm')) tile.querySelector('.thumb').append(el(`<div class="confirm"><span style="flex:1">${d.id} has unsaved work.</span><button class="iconbtn" data-keep>Keep</button><button class="primary" data-really="${d.id}">Close</button></div>`));
    return; }
  if (e.target.closest('[data-keep]')) { e.target.closest('.confirm').remove(); return; }
  const r = e.target.closest('[data-really]'); if (r) { const d = DOCS.find(d => d.id === r.dataset.really); DOCS.splice(DOCS.indexOf(d), 1); if (S.doc === d.id) S.doc = DOCS[0].id; renderAll(); toast(`Closed ${d.id}; its autosave was dropped`); return; }
  const t = e.target.closest('[data-doc]'); if (t) setDoc(t.dataset.doc);
};
$('#feedAll').onclick = e => { const r = e.target.closest('[data-open]'); if (r && DOCS.some(d => d.id === r.dataset.open)) setDoc(r.dataset.open); };
$('#notesmin').onclick = () => { const n = $('#notes'); n.classList.toggle('min'); $('#notesmin').textContent = n.classList.contains('min') ? 'show' : 'hide'; };

rebuild(); renderAll(); resize(); requestAnimationFrame(frame);
</script>
