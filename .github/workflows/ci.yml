# Linux, headless only: builds and tests the modeler, smoke-tests the MCP
# server over stdio, and on main publishes the binary as the rolling
# `latest` release that the action (action.yml) installs in other repos.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Line tables are enough in CI and keep the cache small.
  CARGO_PROFILE_RELEASE_DEBUG: "0"

jobs:
  linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        # Bevy's window backends need these headers to build; the headless
        # server never opens them. Audio and gamepads are off (no ALSA/udev).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake clang libwayland-dev libxkbcommon-dev libx11-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --bin modeler

      - name: Test
        run: cargo test --release --workspace --lib --test gltf_export --test legacy_prefab

      - name: Smoke test (headless MCP over stdio)
        run: ci/smoke.sh target/release/modeler

      - name: Package
        run: |
          mkdir -p dist/modeler
          cp target/release/modeler mcp_driver.py AGENTS.md README.md dist/modeler/
          tar -C dist -czf modeler-linux-x86_64.tar.gz modeler
          ldd target/release/modeler
          # Runs in bare containers: nothing beyond libc / libstdc++.
          if ldd target/release/modeler | grep -E "wayland|asound|udev|X11|xkbcommon"; then
            echo "::error::the binary links a desktop library (above)"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: modeler-linux-x86_64
          path: modeler-linux-x86_64.tar.gz

      - name: Publish the rolling `latest` release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest
          git push -f origin latest
          gh release delete latest --yes || true
          gh release create latest modeler-linux-x86_64.tar.gz \
            --title "latest (main @ ${GITHUB_SHA::7})" \
            --notes "Linux x86_64 build of main at ${GITHUB_SHA}. Run with --headless (no window, no GPU). Install in a workflow with: uses: ${GITHUB_REPOSITORY}@main" \
            --prerelease

  # The binary in a bare container (what a cloud CI session looks like).
  bare:
    needs: linux
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: modeler-linux-x86_64
      - run: |
          tar -xzf modeler-linux-x86_64.tar.gz
          ci/smoke.sh modeler/modeler

  # Renders with no GPU: --offscreen on Mesa's software Vulkan (lavapipe).
  render:
    needs: linux
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: modeler-linux-x86_64
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers python3
          tar -xzf modeler-linux-x86_64.tar.gz
          SMOKE_IMAGE=view.png ci/smoke.sh modeler/modeler render
      - uses: actions/upload-artifact@v4
        with:
          name: render-smoke
          path: view.png

  # The action, installed the way another repo would use it.
  action:
    needs: linux
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: modeler
        uses: ./
      - run: |
          cat .mcp.json
          ci/smoke.sh "${{ steps.modeler.outputs.bin }}"
      - id: rendering
        uses: ./
        with:
          render: true
      - run: |
          grep -q -- --offscreen .mcp.json
          ci/smoke.sh "${{ steps.rendering.outputs.bin }}" render
