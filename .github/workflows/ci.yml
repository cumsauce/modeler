# Builds and tests the modeler on Linux (headless: smoke-tests the MCP
# server over stdio, the build the action (action.yml) installs in other
# repos), builds the desktop app (window + MCP server) for macOS, Windows
# and Linux, and on main publishes every build as the rolling `latest`
# release.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Line tables are enough in CI and keep the cache small.
  CARGO_PROFILE_RELEASE_DEBUG: "0"

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        # Bevy's window backends need these headers to build; the headless
        # server never opens them. Audio and gamepads are off (no ALSA/udev).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake clang libwayland-dev libxkbcommon-dev libx11-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --bin modeler

      - name: Test
        run: cargo test --release --workspace --lib --test gltf_export --test legacy_prefab

      - name: Smoke test (headless MCP over stdio)
        run: ci/smoke.sh target/release/modeler

      - name: Package
        run: |
          mkdir -p dist/modeler
          cp target/release/modeler mcp_driver.py AGENTS.md README.md dist/modeler/
          tar -C dist -czf modeler-linux-x86_64.tar.gz modeler
          ldd target/release/modeler
          # Runs in bare containers: nothing beyond libc / libstdc++.
          if ldd target/release/modeler | grep -E "wayland|asound|udev|X11|xkbcommon"; then
            echo "::error::the binary links a desktop library (above)"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: modeler-linux-x86_64
          path: modeler-linux-x86_64.tar.gz


  # The binary in a bare container (what a cloud CI session looks like).
  bare:
    needs: linux
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: modeler-linux-x86_64
      - run: |
          tar -xzf modeler-linux-x86_64.tar.gz
          ci/smoke.sh modeler/modeler

  # Renders with no GPU: --offscreen on Mesa's software Vulkan (lavapipe).
  render:
    needs: linux
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: modeler-linux-x86_64
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers python3
          tar -xzf modeler-linux-x86_64.tar.gz
          SMOKE_IMAGE=view.png ci/smoke.sh modeler/modeler render
      - uses: actions/upload-artifact@v4
        with:
          name: render-smoke
          path: view.png

  # The action, installed the way another repo would use it.
  action:
    needs: linux
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: modeler
        uses: ./
      - run: |
          cat .mcp.json
          ci/smoke.sh "${{ steps.modeler.outputs.bin }}"
      - id: rendering
        uses: ./
        with:
          render: true
      - run: |
          grep -q -- --offscreen .mcp.json
          ci/smoke.sh "${{ steps.rendering.outputs.bin }}" render

  # The desktop app: the same binary with its preview window, per platform.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x86_64
          - os: windows-2022
            name: windows-x86_64
          - os: ubuntu-24.04
            name: linux-x86_64-desktop
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake clang libwayland-dev libxkbcommon-dev libx11-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.name }}

      - name: Build
        run: cargo build --release --bin modeler

      - name: Smoke test (headless MCP over stdio)
        if: runner.os != 'Windows'
        run: ci/smoke.sh target/release/modeler

      - name: Package (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/modeler
          cp target/release/modeler mcp_driver.py AGENTS.md README.md dist/modeler/
          if [ "$RUNNER_OS" = macOS ]; then
            # A double-clickable app too; the bare binary is what MCP runs.
            app=dist/modeler/modeler.app/Contents
            mkdir -p "$app/MacOS" "$app/Resources"
            cp target/release/modeler "$app/MacOS/modeler"
            cp icons/app-icon.png "$app/Resources/"
            cat > "$app/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>modeler</string>
            <key>CFBundleIdentifier</key><string>dev.modeler.app</string>
            <key>CFBundleExecutable</key><string>modeler</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.0.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          fi
          tar -C dist -czf modeler-${{ matrix.name }}.tar.gz modeler

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/modeler | Out-Null
          Copy-Item target/release/modeler.exe, mcp_driver.py, AGENTS.md, README.md dist/modeler/
          Compress-Archive -Path dist/modeler -DestinationPath modeler-${{ matrix.name }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: modeler-${{ matrix.name }}
          path: modeler-${{ matrix.name }}.*

  # Every build as the rolling `latest` release (main only).
  publish:
    needs: [linux, desktop]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: modeler-*
          merge-multiple: true
      - name: Publish the rolling `latest` release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la modeler-*
          git tag -f latest
          git push -f origin latest
          gh release delete latest --yes || true
          gh release create latest modeler-*.tar.gz modeler-*.zip \
            --title "latest (main @ ${GITHUB_SHA::7})" \
            --notes "Builds of main at ${GITHUB_SHA}.

          - modeler-linux-x86_64.tar.gz: Linux, for CI and servers; run with --headless (no window, no GPU). Install in a workflow with: uses: ${GITHUB_REPOSITORY}@main
          - Desktop app (preview window + MCP server): modeler-macos-arm64.tar.gz (Apple silicon), modeler-macos-x86_64.tar.gz (Intel Mac), modeler-windows-x86_64.zip, modeler-linux-x86_64-desktop.tar.gz. The macOS archives also hold modeler.app (unsigned: right-click > Open the first time). Point your MCP config at the binary, or at mcp_driver.py --proxy to share one window between sessions." \
            --prerelease
